services:
  portfolio-v2:
    build: .
    image: portfolio-v2:latest
    container_name: portfolio-v2
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      # Bound to localhost only — Apache reverse-proxies to this from the
      # public vhost. Do not expose this port publicly.
      - "127.0.0.1:3000:3000"
